services:
  zagent-gateway:
    image: ${ZAGENT_IMAGE:-zagent:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      ZAGENT_GATEWAY_TOKEN: ${ZAGENT_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${ZAGENT_CONFIG_DIR}:/home/node/.zagent
      - ${ZAGENT_WORKSPACE_DIR}:/home/node/clawd
    ports:
      - "${ZAGENT_GATEWAY_PORT:-18789}:18789"
      - "${ZAGENT_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${ZAGENT_GATEWAY_BIND:-lan}",
        "--port",
        "${ZAGENT_GATEWAY_PORT:-18789}"
      ]

  zagent-cli:
    image: ${ZAGENT_IMAGE:-zagent:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${ZAGENT_CONFIG_DIR}:/home/node/.zagent
      - ${ZAGENT_WORKSPACE_DIR}:/home/node/clawd
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
