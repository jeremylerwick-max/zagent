services:
  - type: web
    name: zagent
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: ZAGENT_STATE_DIR
        value: /data/.zagent
      - key: ZAGENT_WORKSPACE_DIR
        value: /data/workspace
      - key: ZAGENT_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: zagent-data
      mountPath: /data
      sizeGB: 1
